<h1>Dragonball Page</h1>
<hr />

<section class="row">
  <div class="col-12 col-sm-6">
    <h3>Agregar: {{ name() }}</h3>
    <input type="text" placeholder="Nombre" class="form-control" [value]="name()" (change)="name.set(txtName.value)" (input)="name.set(txtName.value)" #txtName/>
    <h3>{{ power() }}</h3>
    <input type="number" placeholder="Poder" class="form-control mt-2" [value]="power()" (change)="power.set(+txtPower.value)" (input)="power.set(+txtPower.value)" #txtPower/>

    <button class="btn btn-primary mt-2" (click)="addCharacter()">Agregar</button>
  </div>

  <div class="col-12 col-sm-6">
    <h3>Lista de personajes:</h3>
    <ul>
      @for (character of characters(); track character.id; let idx = $index) {
        @if(character.power > 1000) {
          <li>
            <span>{{ idx + 1 }} - {{ character.name }}</span>
            <strong [class.text-danger]="character.power > 9000" [class.text-info]="character.power <= 9000"> ({{ character.power }})</strong>
          </li>
        } @else {
          <li>
            Aquí no hay nadie.
          </li>
        }

      }
    </ul>
  </div>
</section>
